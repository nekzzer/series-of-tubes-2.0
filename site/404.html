<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404: Packet lost — Series of Tubes</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap">
<style>
  :root{--sea:#57C4E5;--ink:#1E2640;--ink2:#55608A;--paper:#fff;--sun:#FFD23F;--me:#FF4F9A}
  html,body{height:100%}
  body{margin:0;background:var(--sea);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
  .card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:28px 30px;max-width:460px}
  h1{font:800 44px/1 'Baloo 2',system-ui,sans-serif;margin:0 0 10px}
  h1 span{color:var(--me)}
  p{margin:0 0 18px;color:var(--ink2);font-weight:700}
  a{display:inline-block;font:800 18px 'Baloo 2',system-ui,sans-serif;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:6px 16px;text-decoration:none}
  a:focus-visible{outline:3px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
  <main class="card">
    <h1>404: <span>packet lost</span></h1>
    <p>A backhoe found the tube to this page. Our NOC is investigating. Probably squirrels.</p>
    <a href="/">Back to the map</a>
  </main>
</body>
</html>
